x-postgres-creds: &postgres-creds
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-creds
      POSTGRES_DB: data_contract_catalog
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    entrypoint: /pgadmin-entrypoint.sh
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_HOST: postgres
      PGADMIN_SERVER_PORT: "5432"
      PGADMIN_SERVER_USER: user
      PGADMIN_SERVER_PASSWORD: password
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin-servers.json.template:/pgadmin4/servers.json.template:ro
      - ./pgadmin-entrypoint.sh:/pgadmin-entrypoint.sh:ro
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command:
      # Dev only: use 'start --optimized' in production with proper KC_HOSTNAME_URL
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      # Dev only: set KC_HOSTNAME_STRICT: "true" and configure KC_HOSTNAME_URL in production
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data

volumes:
  postgres-data:
  keycloak-data:
