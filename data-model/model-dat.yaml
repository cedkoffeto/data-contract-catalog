# DAT Domain — Data Relations
# Silver DAT contracts consolidate into gold/dat.
# Customer data references fiche_signaletique.

domain: DAT
context: PRODUITS_EPARGNE

relations:
  # ── Customer master references ──
  - ref_name: "customer_reference"
    ref: "FICHE_SIGNAL:CLIENT:fiche_signaletique.numero_personne_host < dat_bdc.numero_personne_host"

  - ref_name: "customer_reference"
    ref: "FICHE_SIGNAL:CLIENT:fiche_signaletique.numero_personne_host < dat_cat.numero_personne_host"

  # ── Silver → Gold aggregation ──
  - ref_name: "feeds_gold"
    ref: "dat_bdc.numero_contrat > gold/dat.contract_id"

  - ref_name: "feeds_gold"
    ref: "dat_cat.numero_contrat > gold/dat.contract_id"
