# CRM Domain — Data Relations
# Silver CRM contracts feed the gold/crm aggregate.
# All CRM contracts reference fiche_signaletique for customer master data.

domain: CRM
context: RELATION_CLIENT

relations:
  # ── Customer master references (Many CRM records → One fiche_signaletique) ──
  - ref_name: "customer_reference"
    ref: "FICHE_SIGNAL:CLIENT:fiche_signaletique.numero_personne_host < crm_activities.numero_personne_host"

  - ref_name: "customer_reference"
    ref: "FICHE_SIGNAL:CLIENT:fiche_signaletique.numero_personne_host < crm_alerte.numero_personne_host"

  - ref_name: "customer_reference"
    ref: "FICHE_SIGNAL:CLIENT:fiche_signaletique.numero_personne_host < crm_comptes_rendu.numero_personne_host"

  - ref_name: "customer_reference"
    ref: "FICHE_SIGNAL:CLIENT:fiche_signaletique.numero_personne_host < crm_ov.numero_personne_host"

  - ref_name: "customer_reference"
    ref: "FICHE_SIGNAL:CLIENT:fiche_signaletique.numero_personne_host < crm_reclamation.numero_personne_host"

  # ── Silver → Gold aggregation ──
  - ref_name: "feeds_gold"
    ref: "crm_activities.row_id > gold/crm.customer_id"

  - ref_name: "feeds_gold"
    ref: "crm_alerte.row_id > gold/crm.customer_id"

  - ref_name: "feeds_gold"
    ref: "crm_comptes_rendu.row_id > gold/crm.customer_id"

  - ref_name: "feeds_gold"
    ref: "crm_ov.row_id > gold/crm.customer_id"

  - ref_name: "feeds_gold"
    ref: "crm_reclamation.row_id > gold/crm.customer_id"

  # ── Gestionnaire assignment ──
  - ref_name: "assigned_manager"
    ref: "GESTIONNAIRE:RELATION_CLIENT:gestionnaire.manager_id - crm_comptes_rendu.row_id"
