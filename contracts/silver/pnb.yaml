---
asset:
  id: "silver/pnb_cumule"
  name: "PNB CUMULÉ"
  maturity: "silver"
  domain: "PNB"
  context: "RENTABILITE"
  type: "data_product"
  description: >
    Produit net bancaire cummulé par personne augmenté par des
    indicateurs calculé au datawarehouse
  version: "1.0.0"
  owners:
    business_owner:
      name: "FINANCE GROUP"
      team: "FINANCE GROUP"
      email: "business.team@attijariwafa.com"
    technical_owner:
      name: "DATALAKE"
      team: "DATALAKE"
      email: "m.mouatacim@attijariwafa.com"
  status: "active"
  tags:
    - customer360
    - pnb
    - silver
    - data-product

contract:
  primary_key:
    - "numero_personne_host"
    - "date_arrete"
    - "code_agence"
    - "type_de_produit"
  grain: "Une ligne par personne par agence par mois et par type de produit"
  refresh:
    frequency: "monthly"
  sla:
    availability: "99.0"
    ready_by: "Le 05 de chaque mois a 10h"
    max_delay_minutes: 60

  schema:
    fields:
      - name: "id_client"
        type: "decimal(8,0)"
        description: "Identifiant client (8 chiffres)"
        required: true
        pii_classification: "indirect"

      - name: "code_agence"
        type: "string"
        description: "Code de l'agence commerciale"
        required: true
        pii_classification: "none"

      - name: "type_de_produit"
        type: "string"
        description: "Type de produit bancaire"
        required: true
        pii_classification: "none"

      - name: "label"
        type: "string"
        description: "Libellé du produit (optionnel)"
        required: false
        pii_classification: "none"

      - name: "date_arrete"
        type: "date"
        description: "Date d'arrêté des indicateurs (dernier jour du mois)"
        required: true
        pii_classification: "none"

      - name: "month"
        type: "int"
        description: "Mois de référence (1..12)"
        required: false
        pii_classification: "none"

      - name: "cess_int_capitaux_cumule_a_fin_m"
        type: "decimal(38,3)"
        description: "Cession intérêts capitaux – cumulé fin mois (M, année N)"
        required: false
        pii_classification: "none"

      - name: "cess_int_capitaux_cumule_a_fin_m_1"
        type: "decimal(38,3)"
        description: "Cession intérêts capitaux – même mois année N−1"
        required: false
        pii_classification: "none"

      - name: "cess_int_capitaux_cumule_a_fin_y_1"
        type: "decimal(38,3)"
        description: "Cession intérêts capitaux – fin d’année N−1 (31/12/N−1)"
        required: false
        pii_classification: "none"

      - name: "cession_interne_capitaux_cumule_a_fin_m"
        type: "decimal(38,3)"
        description: "Cession interne capitaux – cumulé fin mois (M, année N)"
        required: false
        pii_classification: "none"

      - name: "cession_interne_capitaux_cumule_a_fin_m_1"
        type: "decimal(38,3)"
        description: "Cession interne capitaux – même mois année N−1"
        required: false
        pii_classification: "none"

      - name: "cession_interne_capitaux_cumule_a_fin_y_1"
        type: "decimal(38,3)"
        description: "Cession interne capitaux – fin d’année N−1 (31/12/N−1)"
        required: false
