quality:
  checks:
    - name: "completeness_id_client"
      type: "completeness"
      field: "id_client"
      threshold: 1.0
      critical: true

    - name: "completeness_code_agence"
      type: "completeness"
      field: "code_agence"
      threshold: 1.0
      critical: true

    - name: "completeness_type_de_produit"
      type: "completeness"
      field: "type_de_produit"
      threshold: 1.0
      critical: true

    - name: "completeness_date_arrete"
      type: "completeness"
      field: "date_arrete"
      threshold: 1.0
      critical: true

    - name: "valid_date_arrete_last_day"
      type: "rule"
      expression: "date_arrete IS NOT NULL"
      critical: true

    - name: "non_negative_metrics"
      type: "rule"
      expression: >
        cess_int_capitaux_cumule_a_fin_m >= 0 AND
        cess_int_capitaux_cumule_a_fin_m_1 >= 0 AND
        cess_int_capitaux_cumule_a_fin_y_1 >= 0 AND
        cession_interne_capitaux_cumule_a_fin_m >= 0 AND
        cession_interne_capitaux_cumule_a_fin_m_1 >= 0 AND
        cession_interne_capitaux_cumule_a_fin_y_1 >= 0 AND
        encours_moyen_credits_cumule_a_fin_m >= 0 AND
        encours_moyen_credits_cumule_a_fin_m_1 >= 0 AND
        encours_moyen_credits_cumule_a_fin_y_1 >= 0 AND
        encours_moyen_cumule_a_fin_m >= 0 AND
        encours_moyen_cumule_a_fin_m_1 >= 0 AND
        encours_moyen_cumule_a_fin_y_1 >= 0 AND
        encours_moyen_depots_cumule_a_fin_m >= 0 AND
        encours_moyen_depots_cumule_a_fin_m_1 >= 0 AND
        encours_moyen_depots_cumule_a_fin_y_1 >= 0 AND
        encours_moyen_net_cumule_a_fin_m >= 0 AND
        encours_moyen_net_cumule_a_fin_m_1 >= 0 AND
        encours_moyen_net_cumule_a_fin_y_1 >= 0 AND
        int_fd_com_gar_cumule_a_fin_m >= 0 AND
        int_fd_com_gar_cumule_a_fin_m_1 >= 0 AND
        int_fd_com_gar_cumule_a_fin_y_1 >= 0 AND
        interets_emplois_obligatoires_cumule_a_fin_m >= 0 AND
        interets_emplois_obligatoires_cumule_a_fin_m_1 >= 0 AND
        interets_emplois_obligatoires_cumule_a_fin_y_1 >= 0 AND
        marge_commissions_cumule_a_fin_m >= 0 AND
        marge_commissions_cumule_a_fin_m_1 >= 0 AND
        marge_commissions_cumule_a_fin_y_1 >= 0 AND
        marge_interet_analytique_cumule_a_fin_m >= 0 AND
        marge_interet_analytique_cumule_a_fin_m_1 >= 0 AND
        marge_interet_analytique_cumule_a_fin_y_1 >= 0 AND
        marge_interet_directe_cumule_a_fin_m >= 0 AND
        marge_interet_directe_cumule_a_fin_m_1 >= 0 AND
        marge_interet_directe_cumule_a_fin_y_1 >= 0 AND
        marge_resultat_cumule_a_fin_m >= 0 AND
        marge_resultat_cumule_a_fin_m_1 >= 0 AND
        marge_resultat_cumule_a_fin_y_1 >= 0 AND
        mni_cumule_a_fin_m >= 0 AND
        mni_cumule_a_fin_m_1 >= 0 AND
        mni_cumule_a_fin_y_1 >= 0 AND
        mni_credits_sains_cumule_a_fin_m >= 0 AND
        mni_credits_sains_cumule_a_fin_m_1 >= 0 AND
        mni_credits_sains_cumule_a_fin_y_1 >= 0 AND
        mni_depots_cumule_a_fin_m >= 0 AND
        mni_depots_cumule_a_fin_m_1 >= 0 AND
        mni_depots_cumule_a_fin_y_1 >= 0 AND
        mni_vision_commerciale_cumule_a_fin_m >= 0 AND
        mni_vision_commerciale_cumule_a_fin_m_1 >= 0 AND
        mni_vision_commerciale_cumule_a_fin_y_1 >= 0 AND
        pnb_analytique_cumule_a_fin_m >= 0 AND
        pnb_analytique_cumule_a_fin_m_1 >= 0 AND
        pnb_analytique_cumule_a_fin_y_1 >= 0 AND
        pnb_vision_commerciale_cumule_a_fin_m >= 0 AND
        pnb_vision_commerciale_cumule_a_fin_m_1 >= 0 AND
        pnb_vision_commerciale_cumule_a_fin_y_1 >= 0
      critical: true
  on_failure:
    action: "block_publication"
    notify:
      - "tech.owner@attijariwafa.com"
      - "business.team@attijariwafa.com"

security:
  classification: "confidential"
  pii:
    contains_pii: true
    notes: "Contains the client identifier (indirect PII). No nominative personal data is stored."
  access_policies:
    roles:
      - name: "data_management"
        permissions: ["read"]
      - name: "data_eng"
        permissions: ["read"]
      - name: "datalake"
        permissions: ["read", "write"]
    row_level_filters:
      enabled: false
      rules: []
    column_masking:
      - field: None
        policy: None

inputs:
  sources:
    - name: "orc_pnb_client"
      type: "ORC"
      description: "Client repository used to enrich PNB indicators."
      owner: "Data Engineer"
      ready_by: "First week of the month"

    - name: "orc_catalogue_produit"
      type: "ORC"
      description: "Operational source listing all product types and their labels."
      owner: "SOP"
      ready_by: "01:00"

  transformations:
    - step: "live_data_reading"
      description: "Ingest ORC sources into bronze_<DOMAIN> tables."
    - step: "joining_cleaning"
      description: "Join, deduplicate, and standardize data into silver tables."
    - step: "aggregation"
      description: "Compute cumulative values for all PNB indicators."
    - step: "metadata_enrichment"
      description: "Add standard metadata columns (run_date, execution_time)."

output:
  table_name: "pnb"
  storage_format: "ICEBERG"
  location: >
    /warehouse/tablespace/managed/hive/awb_silver.db/PNB_product
  partitioning:
    - "run_date"
  retention:
    type: "time_based"
    value: "365d"

serving:
  technology:
    type: "gold_job"
    enabled: true
    name: "gold_PNB_job"
    notes: "Iceberg silver table consumed by a spark job to build the PNB gold layer."


operations:
  airflow_dag_id: "dp_pnb"
  schedule_cron: "0 23 6 * *"
  expected_runtime_minutes: 40
  alerts_channel: "#alerts-PNB-dp"
  dependencies:
    - "pnb_client_SUCCESS.txt"
  retries:
    max_retries: 2
    backoff_minutes: 10
  logging:
    level: "INFO"
    log_retention_days: 30

lineage:
  upstream:
    - "orc_pnb_client"
    - "orc_catalogue_produit"
  downstream:
    - "customer360_product"
  #  openlineage_job_name: "dp_<DOMAIN>_product"  # todo QUPID
  documentation_links:
    - "https://gitlab.udd.attijariwafa.net/datalake/data-product-contract"
