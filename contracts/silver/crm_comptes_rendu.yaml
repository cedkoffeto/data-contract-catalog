---
asset:
  id: "silver/crm_compte_rendu"
  name: "COMPTES RENDUS CRM"
  maturity: "silver"
  domain: "CRM"
  context: "RELATION_CLIENT"
  type: "data_product"
  description: >
    Données silver des comptes rendus et rapports CRM.
    Dernière version des comptes rendus nettoyée et standardisée.
  version: "1.0.0"
  owners:
    business_owner:
      name: "CRM Team"
      team: "CRM Team"
      email: "hicham.amane@attijariwafa.com"
    technical_owner:
      name: "DATALAKE"
      team: "DATALAKE"
      email: "m.mouatacim@attijariwafa.com"
  status: "active"
  tags:
    - customer360
    - crm
    - comptes_rendu
    - silver
    - data-product

contract:
  primary_key:
    - "row_id_cr"
  grain: "Une ligne par compte rendu CRM"
  refresh:
    frequency: "daily"
  sla:
    availability: "99.0"
    ready_by: "05:00"
    max_delay_minutes: 60
  
  schema:
    fields:
      - name: "row_id_cr"
        type: "string"
        description: "Identifiant unique du compte rendu"
        required: true
        pii_classification: "none"
        business_rules:
          - "Must be unique"
          - "Must exist"
      - name: "numero_personne_host"
        type: "integer"
        description: "Identifiant personne côté système host"
        required: true
        pii_classification: "indirect"
      - name: "date_creation"
        type: "timestamp"
        description: "Date de création du compte rendu"
        required: false
        pii_classification: "none"
      - name: "status_entretien"
        type: "string"
        description: "Statut de l'entretien"
        required: false
        pii_classification: "none"
      - name: "cree_par"
        type: "string"
        description: "Créé par"
        required: false
        pii_classification: "indirect"
      - name: "libelle_cr"
        type: "string"
        description: "Libellé du compte rendu"
        required: false
        pii_classification: "none"
      - name: "nom_activite_cpte"
        type: "string"
        description: "Nom de l'activité du compte"
        required: false
        pii_classification: "none"
      - name: "nature_entretien_client"
        type: "string"
        description: "Nature de l'entretien client"
        required: false
        pii_classification: "none"
      - name: "detail_entretien_client"
        type: "string"
        description: "Détail de l'entretien client"
        required: false
        pii_classification: "sensitive"
      - name: "type_entretien"
        type: "string"
        description: "Type d'entretien"
        required: false
        pii_classification: "none"
      - name: "nature_entretien"
        type: "string"
        description: "Nature de l'entretien"
        required: false
        pii_classification: "none"
      - name: "nature_contact"
        type: "string"
        description: "Nature du contact"
        required: false
        pii_classification: "none"
      - name: "date_modification"
        type: "timestamp"
        description: "Date de modification"
        required: false
        pii_classification: "none"
      - name: "date_diffusion"
        type: "timestamp"
        description: "Date de diffusion"
        required: false
        pii_classification: "none"
      - name: "pr_con_id"
        type: "string"
        description: "ID de contact principal"
        required: false
        pii_classification: "indirect"
      - name: "lieu_entretien"
        type: "string"
        description: "Lieu de l'entretien"
        required: false
        pii_classification: "none"
      - name: "date_realisation"
        type: "timestamp"
        description: "Date de réalisation"
        required: false
        pii_classification: "none"
      - name: "date_creation_activite"
        type: "timestamp"
        description: "Date de création de l'activité"
        required: false
        pii_classification: "none"
      - name: "type_compte_rendu"
        type: "string"
        description: "Type de compte rendu"
        required: false
        pii_classification: "none"
      - name: "nom"
        type: "string"
        description: "Nom"
        required: false
        pii_classification: "none"
      - name: "row_id_activite"
        type: "string"
        description: "ID de l'activité liée"
        required: false
        pii_classification: "none"
      - name: "nature_activite_cpte"
        type: "string"
        description: "Nature de l'activité du compte"
        required: false
        pii_classification: "none"
      - name: "commentaire"
        type: "string"
        description: "Commentaire"
        required: false
        pii_classification: "sensitive"
      - name: "row_id"
        type: "string"
        description: "row_id field"
        required: false

quality:
  checks:
    - name: "completeness_row_id_cr"
      type: "completeness"
      field: "row_id_cr"
      threshold: 1.0
      critical: true
    - name: "uniqueness_row_id_cr"
      type: "uniqueness"
      field: "row_id_cr"
      threshold: 1.0
      critical: true
    - name: "completeness_numero_personne_host"
      type: "completeness"
      field: "numero_personne_host"
      threshold: 1.0
      critical: true
    - name: "freshness_check"
      type: "freshness"
      field: "run_date"
      threshold: 1
      critical: true

  on_failure:
    action: "block_publication"
    notify:
      - "m.mouatacim@attijariwafa.com"
      - "hicham.amane@attijariwafa.com"

security:
  classification: "confidential"
  pii:
    contains_pii: true
    notes: >
      Contains indirect PII through numero_personne_host, cree_par, and pr_con_id identifiers.
      Contains sensitive data in detail_entretien_client and commentaire fields.
  access_policies:
    roles:
      - name: "data_management"
        permissions:
          - "read"
      - name: "data_eng"
        permissions:
          - "read"
      - name: "datalake"
        permissions:
          - "read"
          - "write"
      - name: "crm_team"
        permissions:
          - "read"
    row_level_filters:
      enabled: false
      rules: []
    column_masking:
      - field: "numero_personne_host"
        policy: "mask_partial"
      - field: "cree_par"
        policy: "mask_partial"
      - field: "pr_con_id"
        policy: "mask_partial"
      - field: "detail_entretien_client"
        policy: "mask_full"
      - field: "commentaire"
        policy: "mask_full"

inputs:
  sources:
    - name: "orc_compte_rendu"
      type: "ORC"
      description: "Table bronze des comptes rendus au format ORC"
      owner: "DATALAKE"
      ready_by: "04:00"
  transformations:
    - step: "bronze_ingestion"
      description: "Lecture des données depuis la table bronze ORC"
    - step: "getLive_filtering"
      description: "Application de getLive() basée sur 'row_id' pour récupérer la dernière version des enregistrements"
    - step: "column_renaming"
      description: "Renommage: row_id -> row_id_cr, type_compte_rendu -> libelle_cr, nom_activite -> nom_activite_cpte, nature_activite -> nature_activite_cpte"
    - step: "metadata_enrichment"
      description: "Ajout de métadonnées (run_date, version)"

output:
  table_name: "crm_comptes_rendu"
  storage_format: "ICEBERG"
  location: "/warehouse/tablespace/external/hive/awb_silver.db/crm_comptes_rendu"
  partitioning:
    - "run_date"
  retention:
    type: "time_based"
    value: "365d"

serving:
  technology:
    type: "HIVE"
    enabled: true
    tables:
      - name: "view_crm_comptes_rendu"
      - name: "row_id"
        type: "string"
        description: "row_id field"
        required: false
        source_table: "crm_comptes_rendu"
    notes: "Vue Hive pour les consommateurs des comptes rendus CRM"

operations:
  airflow_dag_id: "dp_silver_crm_comptes_rendu"
  schedule_cron: "0 4 * * *"
  expected_runtime_minutes: 15
  alerts_channel: "#alerts-crm-dp"
  dependencies:
    - "crm_comptes_rendu_bronze_SUCCESS.txt"
  retries:
    max_retries: 2
    backoff_minutes: 10
  logging:
    level: "INFO"
    log_retention_days: 30

lineage:
  upstream:
    - "bronze_orc_compte_rendu"
  downstream:
    - "gold_crm_product"
    - "customer360_product"
  documentation_links:
    - "https://gitlab.udd.attijariwafa.net/datalake/data-product-contract"

