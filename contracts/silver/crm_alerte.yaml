---
asset:
  id: "silver/crm_alerte"
  name: "ALERTES CRM"
  maturity: "silver"
  domain: "CRM"
  context: "RELATION_CLIENT"
  type: "data_product"
  description: >
    Afdf AA Données silver des alertes CRM actives.
    Filtrées pour ne conserver que celles dont la date d'échéance est future ou actuelle.
    Couche silver nettoyée et standardisée.
  version: "1.0.0"
  owners:
    business_owner:
      name: "CRM Team"
      team: "CRM Team"
      email: "hicham.amane@attijariwafa.com"
    technical_owner:
      name: "DATALAKE"
      team: "DATALAKE"
      email: "m.mouatacim@attijariwafa.com"
  status: "active"
  tags:
    - customer360
    - crm
    - alerte
    - silver
    - data-product

contract:
  primary_key:
    - "row_id"
  grain: "Une ligne par alerte CRM active"
  refresh:
    frequency: "daily"
  sla:
    availability: "99.0"
    ready_by: "05:00"
    max_delay_minutes: 60
  
  schema:
    fields:
      - name: "row_id"
        type: "string"
        description: "Identifiant unique de l'alerte"
        required: true
        pii_classification: "none"
        business_rules:
          - "Must be unique"
          - "Must exist"
      - name: "numero_personne_host"
        type: "integer"
        description: "Identifiant personne côté système host"
        required: true
        pii_classification: "indirect"
      - name: "created"
        type: "string"
        description: "Date de création"
        required: false
        pii_classification: "none"
      - name: "last_upd"
        type: "string"
        description: "Date de dernière mise à jour"
        required: false
        pii_classification: "none"
      - name: "opty_cd"
        type: "string"
        description: "Code de l'opportunité liée"
        required: false
        pii_classification: "none"
      - name: "src_type_cd"
        type: "string"
        description: "Code du type de source"
        required: false
        pii_classification: "none"
      - name: "attrib_13"
        type: "string"
        description: "Attribut 13"
        required: false
        pii_classification: "none"
      - name: "statut"
        type: "string"
        description: "Statut de l'alerte"
        required: false
        pii_classification: "none"
      - name: "desc_text"
        type: "string"
        description: "Texte de description"
        required: false
        pii_classification: "none"
      - name: "sr_type_cd"
        type: "string"
        description: "Code du type SR"
        required: false
        pii_classification: "none"
      - name: "montant"
        type: "decimal(10,0)"
        description: "Montant de l'alerte"
        required: false
        pii_classification: "none"
      - name: "famille"
        type: "string"
        description: "Famille de l'alerte"
        required: false
        pii_classification: "none"
      - name: "sous_famille"
        type: "string"
        description: "Sous-famille de l'alerte"
        required: false
        pii_classification: "none"
      - name: "duree"
        type: "decimal(10,0)"
        description: "Durée de l'alerte"
        required: false
        pii_classification: "none"
      - name: "descriptif"
        type: "string"
        description: "Descriptif de l'alerte"
        required: false
        pii_classification: "none"
      - name: "date_echeance"
        type: "timestamp"
        description: "Date d'échéance"
        required: false
        pii_classification: "none"
      - name: "sort"
        type: "string"
        description: "Champ de tri"
        required: false
        pii_classification: "none"
      - name: "reason"
        type: "string"
        description: "Raison"
        required: false
        pii_classification: "none"
      - name: "date_technique"
        type: "date"
        description: "Date technique"
        required: false
        pii_classification: "none"
    relations:
      - ref_name: "personne_host"
        ref: "@crm_alerte.numero_personne_host > @personne_host.numero_personne_host"

quality:
  checks:
    - name: "completeness_row_id"
      type: "completeness"
      field: "row_id"
      threshold: 1.0
      critical: true
    - name: "uniqueness_row_id"
      type: "uniqueness"
      field: "row_id"
      threshold: 1.0
      critical: true
    - name: "completeness_numero_personne_host"
      type: "completeness"
      field: "numero_personne_host"
      threshold: 1.0
      critical: true
    - name: "freshness_check"
      type: "freshness"
      field: "run_date"
      threshold: 1
      critical: true

  on_failure:
    action: "block_publication"
    notify:
      - "m.mouatacim@attijariwafa.com"
      - "hicham.amane@attijariwafa.com"

security:
  classification: "confidential"
  pii:
    contains_pii: true
    notes: >
      Contains indirect PII through numero_personne_host identifier.
  access_policies:
    roles:
      - name: "data_management"
        permissions:
          - "read"
      - name: "data_eng"
        permissions:
          - "read"
      - name: "datalake"
        permissions:
          - "read"
          - "write"
      - name: "crm_team"
        permissions:
          - "read"
    row_level_filters:
      enabled: false
      rules: []
    column_masking:
      - field: "numero_personne_host"
        policy: "mask_partial"

inputs:
  sources:
    - name: "orc_alerte"
      type: "ORC"
      description: "Table bronze des alertes CRM au format ORC"
      owner: "DATALAKE"
      ready_by: "01:00"
  transformations:
    - step: "bronze_ingestion"
      description: "Lecture des données depuis la table bronze ORC"
    - step: "getLive_filtering"
      description: "Application de getLive() pour récupérer la dernière version des enregistrements"
    - step: "column_renaming"
      description: "Renommage de la colonne 'person_uid' en 'numero_personne_host'"
    - step: "column_dropping"
      description: "Suppression de la colonne 'time'"
    - step: "date_filtering"
      description: "Filtrage pour ne conserver que les enregistrements où 'date_echeance' est supérieure ou égale à la date actuelle et n'est pas nulle"
    - step: "metadata_enrichment"
      description: "Ajout de métadonnées (run_date, version)"

output:
  table_name: "crm_alerte"
  storage_format: "ICEBERG"
  location: "/warehouse/tablespace/external/hive/awb_silver.db/crm_alerte"
  partitioning:
    - "run_date"
  retention:
    type: "time_based"
    value: "365d"

serving:
  technology:
    type: "HIVE"
    enabled: true
    tables:
      - name: "view_crm_alerte"
        source_table: "crm_alerte"
    notes: "Vue Hive pour les consommateurs des alertes CRM"
    query_url: "https://datalake.com/query/{tableName}"

operations:
  airflow_dag_id: "dp_silver_crm_alerte"
  schedule_cron: "0 4 * * *"
  expected_runtime_minutes: 15
  alerts_channel: "#alerts-crm-dp"
  dependencies:
    - "crm_alerte_bronze_SUCCESS.txt"
  retries:
    max_retries: 2
    backoff_minutes: 10
  logging:
    level: "INFO"
    log_retention_days: 30

lineage:
  upstream:
    - "bronze_orc_alerte"
  downstream:
    - "gold_crm_product"
    - "customer360_product"
  documentation_links:
    - "https://gitlab.udd.attijariwafa.net/datalake/data-product-contract"

