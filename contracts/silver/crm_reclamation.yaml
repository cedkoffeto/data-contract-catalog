---
asset:
  id: "silver/crm_reclamation"
  name: "RÉCLAMATIONS CRM"
  maturity: "silver"
  domain: "CRM"
  context: "RELATION_CLIENT"
  type: "data_product"
  description: >
    Données silver des réclamations clients CRM.
    Couche silver nettoyée et standardisée avec informations de traitement.
  version: "1.0.0"
  owners:
    business_owner:
      name: "CRM Team"
      team: "CRM Team"
      email: "hicham.amane@attijariwafa.com"
    technical_owner:
      name: "DATALAKE"
      team: "DATALAKE"
      email: "m.mouatacim@attijariwafa.com"
  status: "active"
  tags:
    - customer360
    - crm
    - reclamation
    - silver
    - data-product

contract:
  primary_key:
    - "id_claim"
  grain: "Une ligne par réclamation client"
  refresh:
    frequency: "daily"
  sla:
    availability: "99.0"
    ready_by: "05:00"
    max_delay_minutes: 60
  
  schema:
    fields:
      - name: "id_claim"
        type: "string"
        description: "Identifiant unique de la réclamation"
        required: true
        pii_classification: "none"
        business_rules:
          - "Must be unique"
          - "Must exist"
      - name: "n_compte"
        type: "string"
        description: "Numéro de compte"
        required: true
        pii_classification: "indirect"
      - name: "date_creation"
        type: "string"
        description: "Date de création de la réclamation"
        required: false
        pii_classification: "none"
      - name: "statut"
        type: "string"
        description: "Statut de la réclamation"
        required: false
        pii_classification: "none"
      - name: "famille_produit"
        type: "string"
        description: "Famille de produit"
        required: false
        pii_classification: "none"
      - name: "produit"
        type: "string"
        description: "Produit"
        required: false
        pii_classification: "none"
      - name: "objet"
        type: "string"
        description: "Objet de la réclamation"
        required: false
        pii_classification: "none"
      - name: "numero_client_host"
        type: "string"
        description: "Identifiant client côté système host"
        required: true
        pii_classification: "indirect"
      - name: "date_cloture"
        type: "string"
        description: "Date de clôture"
        required: false
        pii_classification: "none"
      - name: "commentaire_creation"
        type: "string"
        description: "Commentaire à la création"
        required: false
        pii_classification: "sensitive"
      - name: "commentaire_traitement"
        type: "string"
        description: "Commentaire de traitement"
        required: false
        pii_classification: "sensitive"
      - name: "cree_par"
        type: "string"
        description: "Créé par"
        required: false
        pii_classification: "indirect"
      - name: "qualifie_par"
        type: "string"
        description: "Qualifié par"
        required: false
        pii_classification: "indirect"
      - name: "traite_par"
        type: "string"
        description: "Traité par"
        required: false
        pii_classification: "indirect"
      - name: "verifie_par"
        type: "string"
        description: "Vérifié par"
        required: false
        pii_classification: "indirect"
      - name: "motif_rejet"
        type: "string"
        description: "Motif de rejet"
        required: false
        pii_classification: "none"
      - name: "flag_migre"
        type: "string"
        description: "Indicateur de migration"
        required: false
        pii_classification: "none"
      - name: "numero_personne_host"
        type: "string"
        description: "numero_personne_host field"
        required: false
      - name: "row_id"
        type: "string"
        description: "row_id field"
        required: false

quality:
  checks:
    - name: "completeness_id_claim"
      type: "completeness"
      field: "id_claim"
      threshold: 1.0
      critical: true
    - name: "uniqueness_id_claim"
      type: "uniqueness"
      field: "id_claim"
      threshold: 1.0
      critical: true
    - name: "completeness_numero_client_host"
      type: "completeness"
      field: "numero_client_host"
      threshold: 1.0
      critical: true
    - name: "freshness_check"
      type: "freshness"
      field: "run_date"
      threshold: 1
      critical: true

  on_failure:
    action: "block_publication"
    notify:
      - "m.mouatacim@attijariwafa.com"
      - "hicham.amane@attijariwafa.com"

security:
  classification: "confidential"
  pii:
    contains_pii: true
    notes: >
      Contains indirect PII through numero_client_host, n_compte, and user identifiers.
      Contains sensitive data in commentaire_creation and commentaire_traitement fields.
  access_policies:
    roles:
      - name: "data_management"
        permissions:
          - "read"
      - name: "data_eng"
        permissions:
          - "read"
      - name: "datalake"
        permissions:
          - "read"
          - "write"
      - name: "crm_team"
        permissions:
          - "read"
    row_level_filters:
      enabled: false
      rules: []
    column_masking:
      - field: "numero_client_host"
        policy: "mask_partial"
      - field: "n_compte"
        policy: "mask_partial"
      - field: "commentaire_creation"
        policy: "mask_full"
      - field: "commentaire_traitement"
        policy: "mask_full"

inputs:
  sources:
    - name: "ice_reclamations_silver"
      type: "ICEBERG"
      description: "Table des réclamations au format Iceberg"
      owner: "DATALAKE"
      ready_by: "03:00"
  transformations:
    - step: "bronze_ingestion"
      description: "Lecture des données depuis la table Iceberg"
    - step: "column_renaming"
      description: "Renommage: n_demande -> id_claim, ouvert -> date_creation (converti en string), Famille_Produit -> famille_produit, Categorie -> produit, Sous_categorie -> objet, traitee_par -> traite_par"
    - step: "data_type_conversion"
      description: "Conversion de numero_client_host et date_cloture en string"
    - step: "metadata_enrichment"
      description: "Ajout de métadonnées (run_date, version)"

output:
  table_name: "crm_reclamation"
  storage_format: "ICEBERG"
  location: "/warehouse/tablespace/managed/hive/awb_silver.db/crm_reclamation"
  partitioning:
    - "run_date"
  retention:
    type: "time_based"
    value: "365d"

serving:
  technology:
    type: "HIVE"
    enabled: true
    tables:
      - name: "view_crm_reclamation"
      - name: "numero_personne_host"
        type: "string"
        description: "numero_personne_host field"
        required: false
      - name: "row_id"
        type: "string"
        description: "row_id field"
        required: false
        source_table: "crm_reclamation"
    notes: "Vue Hive pour les consommateurs des réclamations CRM"

operations:
  airflow_dag_id: "dp_silver_crm_reclamation"
  schedule_cron: "0 4 * * *"
  expected_runtime_minutes: 15
  alerts_channel: "#alerts-crm-dp"
  dependencies:
    - "crm_reclamation_bronze_SUCCESS.txt"
  retries:
    max_retries: 2
    backoff_minutes: 10
  logging:
    level: "INFO"
    log_retention_days: 30

lineage:
  upstream:
    - "bronze_ice_reclamations_silver"
  downstream:
    - "gold_crm_product"
    - "customer360_product"
  documentation_links:
    - "https://gitlab.udd.attijariwafa.net/datalake/data-product-contract"

