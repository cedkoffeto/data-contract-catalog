---
asset:
  id: "silver/titre_entete"
  name: "EN-TÊTE COMPTES TITRES"
  maturity: "silver"
  domain: ""
  context: "TITRES"
  type: "data_product"
  description: >
    Données d'en-tête des comptes titres par personne, incluant 
    comptes espèces, comptes titres, dates d’ouverture et valorisation, 
    ainsi que les contre-valeurs consolidées.
  version: "1.0.0"
  owners:
    business_owner:
      name: "FINANCE GROUP"
      team: "FINANCE GROUP"
      email: "business.team@attijariwafa.com"
    technical_owner:
      name: "DATALAKE"
      team: "DATALAKE"
      email: "m.mouatacim@attijariwafa.com"
  status: "active"
  tags:
    - titres
    - portefeuille
    - entete
    - silver
    - data-product

contract:
  primary_key:
    - "numero_personne_host"
    - "compte_titre"
  grain: "Une ligne par personne et par compte titre"
  refresh:
    frequency: "daily"
  sla:
    availability: "99.0"
    ready_by: "07:00 daily"
    max_delay_minutes: 60

  schema:
    fields:
      - name: "numero_personne_host"
        type: "int"
        description: "Identifiant personne"
        required: true
        pii_classification: "indirect"

      - name: "compte_espece"
        type: "string"
        description: "Compte espèces associé au compte titre"
        required: false
        pii_classification: "none"

      - name: "compte_titre"
        type: "string"
        description: "Compte titre du client"
        required: true
        pii_classification: "none"

      - name: "date_ouverture"
        type: "timestamp"
        description: "Date d'ouverture du compte titre"
        required: false
        pii_classification: "none"

      - name: "date_valorisation"
        type: "timestamp"
        description: "Date de valorisation du portefeuille titres"
        required: false
        pii_classification: "none"

      - name: "contre_valeur_compte"
        type: "decimal(38,4)"
        description: "Contre-valeur du compte espèces"
        required: false
        pii_classification: "none"

      - name: "total_contre_valeur"
        type: "decimal(38,4)"
        description: "Contre-valeur totale du portefeuille"
        required: false
        pii_classification: "none"

      - name: "statut"
        type: "string"
        description: "Statut du compte titre"
        required: false
        pii_classification: "none"

quality:
  checks:
    - name: "completeness_numero_personne_host"
      type: "completeness"
      field: "numero_personne_host"
      threshold: 1.0
      critical: true

    - name: "completeness_compte_titre"
      type: "completeness"
      field: "compte_titre"
      threshold: 1.0
      critical: true

    - name: "positive_counter_values"
      type: "rule"
      expression: >
        contre_valeur_compte >= 0 AND
        total_contre_valeur >= 0
      critical: true

  on_failure:
    action: "block_publication"
    notify:
      - "m.mouatacim@attijariwafa.com"
      - "business.team@attijariwafa.com"

security:
  classification: "confidential"
  pii:
    contains_pii: true
    notes: "Contains the host person identifier (indirect PII). No nominative personal data is included."
  access_policies:
    roles:
      - name: "data_management"
        permissions: ["read"]
      - name: "data_eng"
        permissions: ["read"]
      - name: "datalake"
        permissions: ["read", "write"]
    row_level_filters:
      enabled: false
      rules: []
    column_masking:
      rules: []

inputs:
  sources:
    - name: "orc_transactions_titres"
      type: "ORC"
      description: "Operational source containing portfolio accounts and securities details."
      owner: "SOP"
      ready_by: "50 22 * * MON-FRI"

  transformations:
    - step: "live_data_reading"
      description: "Ingest ORC sources into bronze_titres tables."
    - step: "joining_cleaning"
      description: "Clean, normalize and deduplicate titre account header data."
    - step: "aggregation"
      description: "Compute consolidated counter-values and derived attributes."
    - step: "metadata_enrichment"
      description: "Add standard metadata (run_date, execution_time)."

output:
  table_name: "titres_entete"
  storage_format: "ICEBERG"
  location: >
    /warehouse/tablespace/managed/hive/awb_silver.db/titres_entete
  partitioning:
    - "run_date"
  retention:
    type: "time_based"
    value: "365d"

serving:
  technology:
    type: "gold_job"
    enabled: true
    name: "gold_titres_entete_job"
    notes: "Spark job consuming the titres_entete silver table to enrich gold layer."

operations:
  airflow_dag_id: "dp_titres_entete"
  schedule_cron: "50 22 * * MON-FRI"
  expected_runtime_minutes: 20
  alerts_channel: "#alerts-TITRES-dp"
  dependencies:
    - "orc_transactions_titres_SUCCESS.txt"
  retries:
    max_retries: 2
    backoff_minutes: 10
  logging:
    level: "INFO"
    log_retention_days: 30

lineage:
  upstream:
    - "orc_transactions_titres"
  downstream:
    - "portfolio_entete_gold"
  documentation_links:
    - "https://gitlab.udd.attijariwafa.net/datalake/data-product-contract"
