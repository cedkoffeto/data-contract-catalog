---
asset:
  id: "silver/client_personne"
  name: "CLIENT PERSONNE"
  maturity: "silver"
  domain: "FICHE_SIGNAL"
  context: "CLIENT"
  type: "data_product"
  description: >
    Table d'association entre les clients et les personnes du système central (Host).
    Permet de lier un client (numero_client_host) à une ou plusieurs personnes
    (numero_personne_host) et vice versa. Clé primaire composite: numero_client_host + numero_personne_host.
  version: "1.0.0"
  owners:
    business_owner:
      name: "FINANCE GROUP"
      team: "FINANCE GROUP"
      email: "business.team@attijariwafa.com"
    technical_owner:
      name: "DATALAKE"
      team: "DATALAKE"
      email: "m.mouatacim@attijariwafa.com"
  status: "active"
  tags:
    - customer360
    - client
    - personne
    - association
    - silver
    - data-product

contract:
  primary_key:
    - "numero_client_host"
    - "numero_personne_host"
  grain: "Une ligne par couple client-personne"
  refresh:
    frequency: "daily"
  sla:
    availability: "99.0"
    ready_by: "Le 05 de chaque mois a 10h"
    max_delay_minutes: 60
  schema:
    fields:
      - name: "numero_client_host"
        type: "integer"
        description: "Identifiant unique du client dans le système central (Host)"
        required: true
        pii_classification: "indirect"
        business_rules:
          - "Must exist"
          - "Foreign key to client"
      - name: "numero_personne_host"
        type: "integer"
        description: "Identifiant unique de la personne dans le système central (Host)"
        required: true
        pii_classification: "indirect"
        business_rules:
          - "Must exist"
          - "Foreign key to personne_host"
      - name: "run_date"
        type: "date"
        description: "Date d'exécution du build du data product"
        required: true
        pii_classification: "none"
        business_rules:
          - "date of data product build"
      - name: "version"
        type: "string"
        description: "Version de la logique de production"
        required: true
        pii_classification: "none"
    relations:
      - ref_name: "client_host"
        ref: "@client_personne.numero_client_host > @client.numero_client_host"
      - ref_name: "personne_host"
        ref: "@client_personne.numero_personne_host > @personne_host.numero_personne_host"

quality:
  checks:
    - name: "completeness_numero_client_host"
      type: "completeness"
      field: "numero_client_host"
      threshold: 1.0
      critical: true
    - name: "completeness_numero_personne_host"
      type: "completeness"
      field: "numero_personne_host"
      threshold: 1.0
      critical: true
    - name: "uniqueness_composite_key"
      type: "uniqueness"
      field: "numero_client_host,numero_personne_host"
      threshold: 1.0
      critical: true
    - name: "referential_integrity_client"
      type: "referential_integrity"
      field: "numero_client_host"
      threshold: 1.0
      critical: true
      description: "Vérification que tous les numero_client_host existent dans la table client"
    - name: "referential_integrity_personne"
      type: "referential_integrity"
      field: "numero_personne_host"
      threshold: 1.0
      critical: true
      description: "Vérification que tous les numero_personne_host existent dans la table personne_host"
    - name: "completeness_run_date"
      type: "completeness"
      field: "run_date"
      threshold: 1.0
      critical: true
    - name: "freshness_check"
      type: "freshness"
      field: "run_date"
      threshold: 1
      critical: true
  on_failure:
    action: "block_publication"
    notify:
      - "m.mouatacim@attijariwafa.com"
      - "business.team@attijariwafa.com"

security:
  classification: "confidential"
  pii:
    contains_pii: true
    notes: >
      Contient des identifiants indirects liant clients et personnes.
  access_policies:
    roles:
      - name: "data_management"
        permissions:
          - "read"
      - name: "data_eng"
        permissions:
          - "read"
      - name: "datalake"
        permissions:
          - "read"
          - "write"
    row_level_filters:
      enabled: false
      rules: []
    column_masking:
      - field: "numero_client_host"
        policy: "mask_partial"
      - field: "numero_personne_host"
        policy: "mask_partial"

inputs:
  sources:
    - name: "silver_fiche_signaletique"
      type: "ICEBERG"
      description: "Fiche signalétique client (silver)"
      owner: "DATALAKE"
      ready_by: "22h"
  transformations:
    - step: "key_extraction"
      description: >
        Extraction des clés unique (numero_client, numero_personne) depuis la fiche
        signalétique, renommées en numero_client_host et numero_personne_host
    - step: "deduplication"
      description: "Dédoublonnage sur la clé composite (numero_client_host, numero_personne_host)"
    - step: "metadata_enrichment"
      description: "Ajout des métadonnées run_date et version"

output:
  table_name: "client_personne"
  storage_format: "ICEBERG"
  location: >
    /warehouse/tablespace/managed/hive/awb_silver.db/client_personne
  partitioning:
    - "run_date"
  retention:
    type: "time_based"
    value: "365d"

serving:
  technology:
    type: "HIVE"
    enabled: true
    tables:
      - name: "view_client_personne"
        source_table: "client_personne"
    notes: "Vue Hive pour les consommateurs"
    query_url: "https://datalake.com/query/{tableName}"

operations:
  airflow_dag_id: "dp_silver_client_personne"
  schedule_cron: "0 4 * * *"
  expected_runtime_minutes: 30
  alerts_channel: "#alerts-client-personne-dp"
  dependencies:
    - "fiche_signaletique_silver_SUCCESS.txt"
  retries:
    max_retries: 2
    backoff_minutes: 10
  logging:
    level: "INFO"
    log_retention_days: 30

lineage:
  upstream:
    - "silver/fiche_signaletique"
  downstream:
    - "silver/client"
    - "silver/personne_host"
    - "gold/crm"
    - "gold/dat"
    - "gold/gestionnaire2"
    - "customer360_product"
  documentation_links:
    - "https://gitlab.udd.attijariwafa.net/datalake/data-product-contract"
