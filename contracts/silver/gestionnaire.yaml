---
asset:
  id: "silver/gestionnaire"
  name: "GESTIONNAIRES"
  maturity: "silver"
  domain: "GESTIONNAIRE"
  context: "RELATION_CLIENT"
  type: "data_product"
  description: >
    Données silver des gestionnaires et leurs relations avec les portefeuilles et clients.
    Table unique enrichie combinant les informations de gestionnaires, portefeuilles,
    et leurs relations. Couche silver nettoyée et standardisée.
  version: "1.0.0"
  owners:
    business_owner:
      name: "GESTIONNAIRE Team"
      team: "GESTIONNAIRE Team"
      email: "hicham.amane@attijariwafa.com"
    technical_owner:
      name: "DATALAKE"
      team: "DATALAKE"
      email: "m.mouatacim@attijariwafa.com"
  status: "active"
  tags:
    - customer360
    - gestionnaire
    - portefeuille
    - silver
    - data-product

contract:
  primary_key:
    - "numero_personne_host"
    - "code_ptf"
  grain: "Un enregistrement par relation personne-portefeuille-gestionnaire"
  refresh:
    frequency: "daily"
  sla:
    availability: "99.0"
    ready_by: "05:00"
    max_delay_minutes: 60
  
  schema:
    fields:
      - name: "numero_personne_host"
        type: "integer"
        description: "Identifiant personne côté système host"
        required: true
        pii_classification: "indirect"
        business_rules:
          - "Must exist"
      - name: "code_ptf"
        type: "string"
        description: "Code du portefeuille"
        required: true
        pii_classification: "none"
        business_rules:
          - "Must exist"
      - name: "code_portefeuille"
        type: "string"
        description: "Code portefeuille (duplicate de code_ptf)"
        required: false
        pii_classification: "none"
      - name: "position"
        type: "string"
        description: "Type de relation entre la personne et le portefeuille"
        required: false
        pii_classification: "none"
      - name: "code_gest"
        type: "string"
        description: "Code du gestionnaire"
        required: false
        pii_classification: "none"
      - name: "rela_position"
        type: "string"
        description: "Type de relation gestionnaire-portefeuille (Y=principal)"
        required: false
        pii_classification: "none"
        business_rules:
          - "Filtered to only include 'Y' (principal) relationships"
      - name: "nom_gestionnaire"
        type: "string"
        description: "Nom du gestionnaire"
        required: false
        pii_classification: "sensitive"
      - name: "prenom_gestionnaire"
        type: "string"
        description: "Prénom du gestionnaire"
        required: false
        pii_classification: "sensitive"
      - name: "code_agence"
        type: "string"
        description: "Code de l'agence (division)"
        required: false
        pii_classification: "none"
      - name: "libelle_agence"
        type: "string"
        description: "Libellé de l'agence (division)"
        required: false
        pii_classification: "none"
    relations:
      - ref_name: "personne_host"
        ref: "@gestionnaire.numero_personne_host > @personne_host.numero_personne_host"

quality:
  checks:
    - name: "completeness_numero_personne_host"
      type: "completeness"
      field: "numero_personne_host"
      threshold: 1.0
      critical: true
    - name: "completeness_code_ptf"
      type: "completeness"
      field: "code_ptf"
      threshold: 1.0
      critical: true
    - name: "uniqueness_composite_key"
      type: "uniqueness"
      field: "numero_personne_host,code_ptf"
      threshold: 1.0
      critical: true
    - name: "referential_integrity_gestionnaire"
      type: "referential_integrity"
      field: "code_gest"
      threshold: 0.95
      critical: false
      description: "Vérification que les code_gest existent dans la table gestionnaire source"
    - name: "freshness_check"
      type: "freshness"
      field: "run_date"
      threshold: 1
      critical: true

  on_failure:
    action: "block_publication"
    notify:
      - "m.mouatacim@attijariwafa.com"
      - "hicham.amane@attijariwafa.com"

security:
  classification: "confidential"
  pii:
    contains_pii: true
    notes: >
      Contains indirect PII through numero_personne_host identifier.
      Sensitive data in nom_gestionnaire and prenom_gestionnaire fields.
  access_policies:
    roles:
      - name: "data_management"
        permissions:
          - "read"
      - name: "data_eng"
        permissions:
          - "read"
      - name: "datalake"
        permissions:
          - "read"
          - "write"
      - name: "gestionnaire_team"
        permissions:
          - "read"
    row_level_filters:
      enabled: false
      rules: []
    column_masking:
      - field: "numero_personne_host"
        policy: "mask_partial"
      - field: "nom_gestionnaire"
        policy: "mask_partial"
      - field: "prenom_gestionnaire"
        policy: "mask_partial"

inputs:
  sources:
    - name: "orc_portefeuille"
      type: "ORC"
      description: "Table bronze des portefeuilles au format ORC"
      owner: "DATALAKE"
      ready_by: "01:00"
    - name: "orc_gestionnaire"
      type: "ORC"
      description: "Table bronze des gestionnaires au format ORC"
      owner: "DATALAKE"
      ready_by: "01:00"
    - name: "orc_ptf_gestionnaire"
      type: "ORC"
      description: "Table bronze de relation portefeuille-gestionnaire au format ORC"
      owner: "DATALAKE"
      ready_by: "01:00"
    - name: "orc_ptf_personne"
      type: "ORC"
      description: "Table bronze de relation portefeuille-personne au format ORC"
      owner: "DATALAKE"
      ready_by: "01:00"
  transformations:
    - step: "bronze_ingestion"
      description: "Lecture des données depuis les 4 tables bronze ORC: portefeuille, gestionnaire, ptf_gestionnaire, ptf_personne"
    - step: "getLive_filtering"
      description: "Application de getLive() pour récupérer la dernière version des enregistrements de chaque table source"
    - step: "column_renaming_portefeuille"
      description: "Renommage des colonnes portefeuille: code_div->code_agence, division->libelle_agence"
    - step: "column_renaming_gestionnaire"
      description: "Renommage des colonnes gestionnaire: nom_gest->nom_gestionnaire, prenom_gest->prenom_gestionnaire"
    - step: "column_renaming_relations"
      description: "Renommage type_relation en rela_position pour ptf_gestionnaire et position pour ptf_personne"
    - step: "gestionnaire_principal_filtering"
      description: "Filtrage pour ne conserver que les gestionnaires principaux (rela_position='Y')"
    - step: "code_portefeuille_duplication"
      description: "Ajout d'une colonne code_portefeuille (duplicate de code_ptf) dans ptf_personne"
    - step: "join_enrichment"
      description: "Jointures LEFT OUTER successives: (1) rela_gest_principal + gestionnaire, (2) + relaPersonnePtf, (3) + portefeuille"
    - step: "metadata_enrichment"
      description: "Ajout de métadonnées (run_date, version)"

output:
  table_name: "gestionnaire"
  storage_format: "ICEBERG"
  location: "/warehouse/tablespace/managed/hive/awb_silver.db/gestionnaire"
  partitioning:
    - "run_date"
  retention:
    type: "time_based"
    value: "365d"

serving:
  technology:
    type: "HIVE"
    enabled: true
    tables:
      - name: "view_gestionnaire"
        source_table: "gestionnaire"
    notes: "Vue Hive pour les consommateurs avec la table gestionnaire enrichie"
    query_url: "https://datalake.com/query/{tableName}"

operations:
  airflow_dag_id: "dp_silver_gestionnaire"
  schedule_cron: "0 4 * * *"
  expected_runtime_minutes: 30
  alerts_channel: "#alerts-gestionnaire-dp"
  dependencies:
    - "portefeuille_bronze_SUCCESS.txt"
    - "gestionnaire_bronze_SUCCESS.txt"
  retries:
    max_retries: 2
    backoff_minutes: 10
  logging:
    level: "INFO"
    log_retention_days: 30

lineage:
  upstream:
    - "bronze_orc_portefeuille"
    - "bronze_orc_gestionnaire"
    - "bronze_orc_ptf_gestionnaire"
    - "bronze_orc_ptf_personne"
  downstream:
    - "gold_gestionnaire_product"
    - "customer360_product"
  documentation_links:
    - "https://gitlab.udd.attijariwafa.net/datalake/data-product-contract"

