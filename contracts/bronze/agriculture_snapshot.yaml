      required: true
      pii_classification: restricted
      business_rules:
      - ''
    - name: NUM_ENR
      type: string
      description: Record number for agriculture agriculture_snapshot
      required: true
      pii_classification: none
      business_rules:
      - ''
    - name: SOURCE
      type: string
      description: Source system for agriculture agriculture_snapshot
      required: true
      pii_classification: none
      business_rules:
      - ''
    - name: STATUS
      type: string
      description: Record status
      required: true
      pii_classification: none
      business_rules:
      - ''
    - name: CREATED_AT
      type: timestamp
      description: Creation timestamp for agriculture agriculture_snapshot
      required: true
      pii_classification: none
      business_rules:
      - ''
      extra_properties:
        sql_expression: FROM_UNIXTIME(UNIX_TIMESTAMP(CREATED_AT, 'yyyyMMdd'), 'yyyy-MM-dd')
    - name: UPDATED_AT
      type: timestamp
      description: Last update timestamp
      required: true
      pii_classification: none
      business_rules:
      - ''
    - name: AGRICULTURE_ID
      type: string
      description: agriculture agriculture_snapshot identifier
      required: true
      pii_classification: none
      business_rules:
      - ''
    relations:
    - ref_name: "stream_snapshots"
      ref: "@agriculture_snapshot.ID > @agriculture_stream.ID"
