roles:
  - name: admin
    permissions:
      - read
      - write
      - admin
    description: "Full access to all contracts and administration"

  - name: editor
    permissions:
      - read
      - write
    description: "Can view and edit contracts"

  - name: reader
    permissions:
      - read
    description: "Can only view contracts"

  - name: data_owner
    permissions:
      - read
      - write
    description: "Can view and edit contracts they own"
